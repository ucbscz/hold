<app-formulario-admin-marco [formulario]="this">
  <form #form="ngForm" (ngSubmit)="validarEnvio()">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="modelo.nombre"
        required
        maxlength="25"
        placeholder="Ingresa el nombre del accesorio"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="modelo">Modelo</label>
      <input
        type="text"
        id="modelo"
        name="modelo"
        [(ngModel)]="modelo.modelo"
        required
        maxlength="25"
        placeholder="Modelo del accesorio"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="tipo">Tipo</label>
      <input
        type="text"
        id="tipo"
        name="tipo"
        [(ngModel)]="modelo.tipo"
        required
        maxlength="25"
        placeholder="Tipo de accesorio"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        name="descripcion"
        [(ngModel)]="modelo.descripcion"
        rows="3"
        maxlength="100"
        placeholder="Describe las características del accesorio"
        class="form-input"
      ></textarea>
    </div>
    <div class="form-group">
      <label for="codigo_imt">Código IMT</label>
      <app-custom-select
        name="codigo_imt"
        [(ngModel)]="modelo.id_equipo"
        required
        [opciones]="equiposOpciones"
        placeholder="Selecciona un equipo"
      ></app-custom-select>
    </div>
    <div class="form-group">
      <label for="precio">Precio</label>
      <input
        type="number"
        id="precio"
        name="precio"
        [(ngModel)]="modelo.precio"
        step="0.01"
        max="999999999"
        placeholder="0.00"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="url_data_sheet">URL Data Sheet</label>
      <input
        type="url"
        id="url_data_sheet"
        name="url_data_sheet"
        [(ngModel)]="modelo.url_data_sheet"
        maxlength="255"
        pattern="https?://.+"
        placeholder="https://ejemplo.com/datasheet.pdf"
        class="form-input"
      />
    </div>
    <app-formulario-admin-envio
      [formulario]="this"
      [deshabilitado]="!form.valid || procesando"
    />
  </form>
</app-formulario-admin-marco>
