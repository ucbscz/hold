<app-formulario-admin-marco [formulario]="this">
  <form #form="ngForm" (ngSubmit)="validarEnvio()">
    <div class="form-group">
      <label for="nombre">Nombre Empresa</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="modelo.NombreEmpresa"
        required
        maxlength="50"
        placeholder="Ingresa el nombre de la empresa"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="nombreResponsable">Nombre Responsable</label>
      <input
        type="text"
        id="nombreResponsable"
        name="nombreResponsable"
        [(ngModel)]="modelo.NombreResponsable"
        required
        maxlength="50"
        placeholder="Nombre del responsable"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="apellidoResponsable">Apellido Responsable</label>
      <input
        type="text"
        id="apellidoResponsable"
        name="apellidoResponsable"
        [(ngModel)]="modelo.ApellidoResponsable"
        required
        maxlength="50"
        placeholder="Apellido del responsable"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input
        type="tel"
        id="telefono"
        name="telefono"
        [(ngModel)]="modelo.Telefono"
        required
        maxlength="15"
        placeholder="Teléfono de contacto"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="direccion">Dirección</label>
      <input
        type="text"
        id="direccion"
        name="direccion"
        [(ngModel)]="modelo.Direccion"
        maxlength="100"
        placeholder="Dirección de la empresa"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="nit">NIT</label>
      <input
        type="text"
        id="nit"
        name="nit"
        [(ngModel)]="modelo.Nit"
        maxlength="20"
        placeholder="NIT de la empresa"
        class="form-input"
      />
    </div>
    <app-formulario-admin-envio
      [formulario]="this"
      [deshabilitado]="!form.valid || procesando"
    />
  </form>
</app-formulario-admin-marco>
