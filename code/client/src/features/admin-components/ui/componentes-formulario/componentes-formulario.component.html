<app-formulario-admin-marco [formulario]="this">
  <form #form="ngForm" (ngSubmit)="validarEnvio()">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="modelo.Nombre"
        required
        maxlength="50"
        placeholder="Ingresa el nombre del componente"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="modelo">Modelo</label>
      <input
        type="text"
        id="modelo"
        name="modelo"
        [(ngModel)]="modelo.Modelo"
        required
        maxlength="50"
        placeholder="Modelo del componente"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="tipo">Tipo</label>
      <input
        type="text"
        id="tipo"
        name="tipo"
        [(ngModel)]="modelo.Tipo"
        required
        maxlength="50"
        placeholder="Tipo de componente"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="codigo_imt">Código IMT del equipo</label>
      <app-custom-select
        name="codigo_imt"
        [(ngModel)]="modelo.IdEquipo"
        required
        [opciones]="equiposOpciones"
        placeholder="Selecciona un equipo"
      ></app-custom-select>
    </div>
    <div class="form-group">
      <label for="precio">Precio de referencia</label>
      <input
        type="number"
        id="precio"
        name="precio"
        [(ngModel)]="modelo.PrecioReferencia"
        min="0"
        step="0.01"
        placeholder="0.00"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        name="descripcion"
        [(ngModel)]="modelo.Descripcion"
        rows="3"
        maxlength="200"
        placeholder="Describe las características del componente"
        class="form-input"
      ></textarea>
    </div>
    <div class="form-group">
      <label for="url_data_sheet">URL Data Sheet</label>
      <input
        type="url"
        id="url_data_sheet"
        name="url_data_sheet"
        maxlength="200"
        pattern="https?://.+"
        [(ngModel)]="modelo.UrlDataSheet"
        placeholder="https://ejemplo.com/datasheet.pdf"
        class="form-input"
      />
    </div>
    <app-formulario-admin-envio
      [formulario]="this"
      [deshabilitado]="!form.valid || procesando"
    />
  </form>
</app-formulario-admin-marco>
