<app-formulario-admin-marco [formulario]="this">
  <form #form="ngForm" (ngSubmit)="validarEnvio()">
    <div class="form-group">
      <label for="Nombre">Nombre</label>
      <input
        type="text"
        id="Nombre"
        name="Nombre"
        [(ngModel)]="modelo.Nombre"
        required
        maxlength="50"
        placeholder="Nombre del mueble"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="Tipo">Tipo</label>
      <input
        type="text"
        id="Tipo"
        name="Tipo"
        [(ngModel)]="modelo.Tipo"
        maxlength="50"
        placeholder="Tipo de mueble"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="Ambiente">Ambiente</label>
      <app-custom-select
        id="Ambiente"
        name="Ambiente"
        [(ngModel)]="modelo.IdAmbiente"
        [opciones]="ambientes"
        placeholder="Seleccionar ambiente"
        required
      />
    </div>
    <div class="form-group">
      <label for="Ubicacion">Referencia dentro del ambiente</label>
      <input
        type="text"
        id="Ubicacion"
        name="Ubicacion"
        [(ngModel)]="modelo.Ubicacion"
        maxlength="200"
        placeholder="Ejemplo: pared junto a la entrada"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="Costo">Costo</label>
      <input
        type="number"
        id="Costo"
        name="Costo"
        [(ngModel)]="modelo.Costo"
        max="999999999"
        step="0.01"
        min="0"
        placeholder="0.00"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="Longitud">Longitud (cm)</label>
      <input
        type="number"
        id="Longitud"
        name="Longitud"
        [(ngModel)]="modelo.Longitud"
        max="10000"
        step="0.01"
        min="0"
        placeholder="0.00"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="Profundidad">Profundidad (cm)</label>
      <input
        type="number"
        id="Profundidad"
        name="Profundidad"
        [(ngModel)]="modelo.Profundidad"
        max="10000"
        step="0.01"
        min="0"
        placeholder="0.00"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="Altura">Altura (cm)</label>
      <input
        type="number"
        id="Altura"
        name="Altura"
        [(ngModel)]="modelo.Altura"
        max="10000"
        step="0.01"
        min="0"
        placeholder="0.00"
        class="form-input"
      />
    </div>
    <app-formulario-admin-envio
      [formulario]="this"
      [deshabilitado]="!form.valid || procesando"
    />
  </form>
</app-formulario-admin-marco>
