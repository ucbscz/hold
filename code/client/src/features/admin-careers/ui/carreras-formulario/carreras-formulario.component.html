<app-formulario-admin-marco [formulario]="this">
  <form #form="ngForm" (ngSubmit)="validarEnvio()">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="modelo.Nombre"
        (ngModelChange)="error.set(false)"
        required
        maxlength="50"
        minlength="3"
        placeholder="Ingresa el nombre de la carrera"
        class="form-input"
      />
    </div>
    <div class="form-group">
      <label for="codigo">Código</label>
      <input
        type="text"
        id="codigo"
        name="codigo"
        [ngModel]="modelo.Codigo"
        (ngModelChange)="normalizarCodigo($event)"
        required
        maxlength="10"
        minlength="2"
        pattern="[A-Z0-9]{2,10}"
        autocapitalize="characters"
        placeholder="Ej. IMT"
        class="form-input"
      />
    </div>
    <app-formulario-admin-envio
      [formulario]="this"
      [deshabilitado]="!form.valid || procesando"
      [descartable]="false"
    />
  </form>
</app-formulario-admin-marco>
