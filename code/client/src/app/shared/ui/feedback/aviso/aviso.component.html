<div class="container">
  <button class="cerrar" (click)="click()" aria-label="Cerrar">
    <img src="assets/x.png" alt="Cerrar" />
  </button>
  <h1>Aviso</h1>
  <div class="mensaje-container">
    <p>{{ mensaje }}</p>
  </div>
  <div class="botones-container">
    <button type="button" class="volver-btn" (click)="click()">Cancelar</button>
    <button type="button" class="aceptar" (click)="onAceptar()">Aceptar</button>
  </div>
</div>
