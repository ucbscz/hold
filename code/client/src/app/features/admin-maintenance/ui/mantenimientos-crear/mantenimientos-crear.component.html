<div class="form-container">
  <header class="form-header">
    <h2>Registrar mantenimiento</h2>
    <button class="btn-close" (click)="cerrar()" aria-label="Cerrar">
      <img src="assets/x.png" alt="" />
    </button>
  </header>
  <div class="form-content">
    <form #form="ngForm">
      <div class="form-group">
        <label for="NombreEmpresaMantenimiento">Empresa de Mantenimiento</label>
        <app-custom-select
          name="NombreEmpresaMantenimiento"
          [(ngModel)]="mantenimiento.NombreEmpresaMantenimiento"
          required
          [opciones]="empresas"
          placeholder="Selecciona una empresa"
        ></app-custom-select>
      </div>
      <div class="form-group">
        <label for="FechaMantenimiento">Fecha de Inicio</label>
        <input
          type="text"
          appFlatpickr
          [fpOptions]="opcionesFechaInicio"
          id="FechaMantenimiento"
          name="FechaMantenimiento"
          [(ngModel)]="mantenimiento.FechaMantenimiento"
          required
          class="form-input date-input"
          placeholder="Selecciona la fecha de inicio"
          readonly
          (fpChange)="onFechaMantenimiento($event)"
        />
      </div>
      <div class="form-group">
        <label for="FechaFinalDeMantenimiento">Fecha de Finalización</label>
        <input
          type="text"
          appFlatpickr
          [fpOptions]="opcionesFechaFinal"
          id="FechaFinalDeMantenimiento"
          name="FechaFinalDeMantenimiento"
          [(ngModel)]="mantenimiento.FechaFinalDeMantenimiento"
          required
          class="form-input date-input"
          placeholder="Selecciona la fecha final"
          readonly
          (fpChange)="onFechaFinalDeMantenimiento($event)"
        />
      </div>
      <div class="form-group">
        <label for="Costo">Costo</label>
        <input
          type="number"
          id="Costo"
          name="Costo"
          [(ngModel)]="mantenimiento.Costo"
          required
          step="0.01"
          min="0"
          placeholder="0.00"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="Descripcion">Descripción del Mantenimiento</label>
        <textarea
          id="Descripcion"
          name="Descripcion"
          [(ngModel)]="mantenimiento.Descripcion"
          rows="3"
          placeholder="Describe el mantenimiento realizado"
          class="form-input"
        ></textarea>
      </div>
      @if (mantenimientoSeleccionado.size > 0) {
        <section class="equipos-seleccionados" aria-label="Equipos incluidos">
          <button
            type="button"
            class="equipos-seleccionados__toggle"
            (click)="alternarEquiposSeleccionados()"
            [attr.aria-expanded]="equiposExpandidos"
          >
            <span
              >Equipos incluidos ({{ mantenimientoSeleccionado.size }})</span
            >
            <i
              class="fas"
              [class.fa-chevron-down]="!equiposExpandidos"
              [class.fa-chevron-up]="equiposExpandidos"
            ></i>
          </button>
          @if (equiposExpandidos) {
            <div class="equipos-seleccionados__list">
              @for (
                item of mantenimientoSeleccionado | keyvalue;
                track item.key
              ) {
                <div class="equipo-pill">
                  <div class="equipo-pill__identity">
                    <span class="equipo-id">IMT {{ item.key }}</span>
                    <span class="equipo-nombre" [title]="item.value.nombre">{{
                      item.value.nombre
                    }}</span>
                  </div>
                  <app-custom-select
                    class="equipo-pill__type"
                    [ngModel]="item.value.TipoMantenimiento"
                    (ngModelChange)="actualizarTipoEquipo(item.key, $event)"
                    [ngModelOptions]="{ standalone: true }"
                    [opciones]="tipoOpciones"
                  ></app-custom-select>
                  <button
                    type="button"
                    class="btn-remove"
                    (click)="eliminarEquipo(item.key)"
                    aria-label="Quitar equipo"
                  >
                    <img
                      class="remove-icon"
                      src="assets/x.png"
                      alt=""
                      width="12"
                      height="12"
                    />
                  </button>
                </div>
              }
            </div>
          }
        </section>
      }
      @if (error()) {
        <app-mostrarerror
          [inline]="true"
          [error]="error"
          [mensaje]="mensajeerror"
        ></app-mostrarerror>
      }
      <div class="form-submit">
        <button
          class="btn btn-secondary btn-agregar-equipo"
          type="button"
          (click)="agregarEquipo()"
        >
          <i class="fas fa-plus"></i> Agregar equipo
        </button>
        <button
          (click)="validarcreacion()"
          type="submit"
          class="btn btn-primary register-button"
          [disabled]="!form.valid || !validarFecha()"
        >
          <i class="fas fa-check"></i>
          <span>Registrar mantenimiento</span>
        </button>
      </div>
    </form>
  </div>
</div>
@if (agregarequipo()) {
  <app-lista-equipo [agregarequipo]="agregarequipo"> </app-lista-equipo>
}
@if (aviso()) {
  <app-aviso
    [cerrar]="aviso"
    [mensaje]="mensajeaviso"
    (aceptar)="registrar()"
  ></app-aviso>
}
@if (exito()) {
  <app-aviso-exito
    [exito]="exito"
    [mensaje]="mensajeexito"
    (accion)="cerrar()"
  ></app-aviso-exito>
}
