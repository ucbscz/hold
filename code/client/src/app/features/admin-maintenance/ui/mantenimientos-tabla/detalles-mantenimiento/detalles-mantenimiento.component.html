<div class="mantenimientos-container">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Detalles de Mantenimientos</h2>
      <button class="btn-close" (click)="cerrarDetalles()" title="Cerrar">
        ×
      </button>
    </div>
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>CodigoIMT</th>
            <th>Tipo de Mantenimiento</th>
            <th>DescripciónEquipo</th>
          </tr>
        </thead>
        <tbody>
          @for (mantenimiento of mantenimientos; track $index; let i = $index) {
            <tr>
              <td>{{ mantenimiento.CodigoImtEquipo }}</td>
              <td>
                <app-custom-select
                  [(ngModel)]="mantenimiento.TipoMantenimiento"
                  [opciones]="tipoOpciones"
                  [searchThreshold]="99"
                ></app-custom-select>
              </td>
              <td>{{ mantenimiento.DescripcionEquipo }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cerrarDetalles()">
        Cerrar
      </button>
      <button class="btn btn-primary" [disabled]="guardando" (click)="guardarCambios()">
        {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </div>
  </div>
</div>
