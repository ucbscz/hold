<div class="form-container">
  <button class="btn-close" (click)="cerrar()">
    <img src="assets/x.png" alt="Cerrar" />
  </button>
  <div class="form-content">
    <h2>Registrar Grupo de Equipo</h2>
    <section class="url-import" aria-labelledby="url-import-title">
      <div>
        <strong id="url-import-title">Importar desde una página</strong>
        <span>Revisa los datos recuperados antes de registrar.</span>
      </div>
      <div class="url-import__controls">
        <input
          type="url"
          name="urlImportacion"
          maxlength="2048"
          [(ngModel)]="urlImportacion"
          (ngModelChange)="importacionCompleta = false; error.set(false)"
          placeholder="https://fabricante.com/producto"
          class="form-input"
          aria-label="URL pública del producto"
        />
        <button
          type="button"
          class="import-button"
          [disabled]="importando || !urlImportacion.trim()"
          (click)="importar()"
        >
          <i
            class="fas"
            [class.fa-spinner]="importando"
            [class.fa-spin]="importando"
            [class.fa-download]="!importando"
            aria-hidden="true"
          ></i>
          {{ importando ? "Importando..." : "Importar" }}
        </button>
      </div>
      @if (importacionCompleta) {
        <p class="url-import__success" role="status">
          Datos recuperados. Completa los campos faltantes y confirma el
          registro.
        </p>
      }
    </section>
    <form #form="ngForm" (ngSubmit)="validarregistro()">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="grupoEquipo.nombre"
          required
          maxlength="50"
          placeholder="Ingresa el nombre del grupo de equipo"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="modelo">Modelo</label>
        <input
          type="text"
          id="modelo"
          name="modelo"
          required
          maxlength="50"
          [(ngModel)]="grupoEquipo.modelo"
          placeholder="Modelo del grupo de equipo"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="marca">Marca</label>
        <input
          type="text"
          id="marca"
          name="marca"
          required
          maxlength="50"
          [(ngModel)]="grupoEquipo.marca"
          placeholder="Marca del grupo de equipo"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="nombreCategoria">Categoría</label>
        <app-custom-select
          name="nombreCategoria"
          required
          [(ngModel)]="grupoEquipo.nombreCategoria"
          [opciones]="categorias"
          placeholder="Categoría del grupo de equipo"
        ></app-custom-select>
      </div>
      <div class="form-group">
        <label for="tiempoMaximoPrestamoDias">Préstamo máximo (días)</label>
        <input
          type="number"
          id="tiempoMaximoPrestamoDias"
          name="tiempoMaximoPrestamoDias"
          [(ngModel)]="grupoEquipo.TiempoMaximoPrestamoDias"
          required
          min="1"
          max="365"
          step="1"
          placeholder="7"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          name="descripcion"
          [(ngModel)]="grupoEquipo.descripcion"
          rows="3"
          maxlength="200"
          required
          placeholder="Describe las características del grupo de equipo"
          class="form-input"
        ></textarea>
      </div>
      <div class="form-group">
        <label for="url_data_sheet">URL Data Sheet</label>
        <input
          type="url"
          id="url_data_sheet"
          name="url_data_sheet"
          maxlength="200"
          [(ngModel)]="grupoEquipo.url_data_sheet"
          pattern="https?://.+"
          placeholder="https://ejemplo.com/datasheet.pdf"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="link">URL Imagen</label>
        <input
          type="url"
          id="link"
          name="link"
          required
          maxlength="200"
          pattern="https?://.+"
          [(ngModel)]="grupoEquipo.link"
          placeholder="https://ejemplo.com/imagen.jpg"
          class="form-input"
        />
      </div>
      @if (error()) {
        <app-mostrarerror
          [inline]="true"
          [error]="error"
          [mensaje]="mensajeerror"
        ></app-mostrarerror>
      }
      <div class="form-submit">
        <button
          type="submit"
          class="register-button"
          [disabled]="!form.valid || procesando || importando"
        >
          <span>Registrar Grupo de Equipo</span>
        </button>
      </div>
    </form>
  </div>
</div>
@if (aviso()) {
  <app-aviso
    [cerrar]="aviso"
    [mensaje]="mensajeaviso"
    (aceptar)="registrar()"
  ></app-aviso>
}
