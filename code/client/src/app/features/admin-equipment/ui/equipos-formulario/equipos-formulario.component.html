<div class="form-container">
  <button class="btn-close" (click)="cerrar()">
    <img src="assets/x.png" alt="Cerrar" />
  </button>
  <div class="form-content">
    <h2>{{ textos.titulo }}</h2>
    <form #form="ngForm" (ngSubmit)="validarEnvio()">
      <div class="form-group">
        <label for="grupo-equipo">Grupo Equipo</label>
        <app-custom-select
          name="grupo-equipo"
          [(ngModel)]="grupoequipoSeleccionado"
          [required]="!editando"
          [opciones]="gruposOpciones"
          placeholder="Seleccione un grupo de equipo"
        ></app-custom-select>
      </div>
      <div class="form-group">
        <label for="codigo_ucb">Código UCB (opcional)</label>
        <input
          type="text"
          id="codigo_ucb"
          name="codigo_ucb"
          [(ngModel)]="modelo.CodigoUcb"
          maxlength="20"
          placeholder="Código UCB del equipo"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="numero_serial">Número Serial</label>
        <input
          type="text"
          id="numero_serial"
          name="numero_serial"
          [(ngModel)]="modelo.NumeroSerial"
          required
          maxlength="50"
          placeholder="Número serial del equipo"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="estado_equipo">Estado Equipo</label>
        <app-custom-select
          name="estado_equipo"
          [(ngModel)]="modelo.EstadoEquipo"
          required
          [opciones]="estadoOpciones"
          placeholder="Estado del equipo"
        ></app-custom-select>
      </div>
      <app-catalogo-selector [equipo]="modelo" />
      <div class="form-group">
        <label for="nombre_gavetero">Gavetero</label>
        <app-custom-select
          name="nombre_gavetero"
          [(ngModel)]="gaveteroSeleccionado"
          [opciones]="gaveterosOpciones"
          placeholder="Sin gavetero"
        ></app-custom-select>
      </div>
      <div class="form-group">
        <label for="costo_referencia">Costo de referencia (Bs)</label>
        <input
          type="number"
          id="costo_referencia"
          name="costo_referencia"
          min="0"
          [(ngModel)]="modelo.CostoReferencia"
          required
          max="999999999"
          step="0.01"
          placeholder="0.00"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          name="descripcion"
          [(ngModel)]="modelo.Descripcion"
          rows="3"
          maxlength="200"
          placeholder="Describe las características del equipo"
          class="form-input"
        ></textarea>
      </div>

      @if (error()) {
        <app-mostrarerror
          [inline]="true"
          [error]="error"
          [mensaje]="mensajeerror"
        ></app-mostrarerror>
      }
      <div class="form-submit">
        <button
          type="submit"
          class="register-button"
          [disabled]="!form.valid || procesando"
        >
          <span>{{ textos.boton }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
@if (aviso()) {
  <app-aviso
    [cerrar]="aviso"
    [mensaje]="mensajeaviso"
    (aceptar)="confirmar()"
  ></app-aviso>
}
