<div class="form-container">
  <button class="btn-close" (click)="cerrar()">
    <img src="assets/x.png" alt="Cerrar" />
  </button>
  <div class="form-content">
    <h2>{{ textos.titulo }}</h2>
    <form #form="ngForm" (ngSubmit)="validarEnvio()">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="modelo.Nombre"
          required
          maxlength="50"
          placeholder="Ingresa el nombre del gavetero"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="tipo">Tipo</label>
        <input
          type="text"
          id="tipo"
          name="tipo"
          [(ngModel)]="modelo.Tipo"
          required
          maxlength="50"
          placeholder="Tipo de gavetero"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="nombre_mueble">Nombre Mueble</label>
        <app-custom-select
          name="nombre_mueble"
          [(ngModel)]="modelo.NombreMueble"
          required
          [opciones]="muebles"
          placeholder="Selecciona un mueble"
        ></app-custom-select>
      </div>
      <div class="form-group">
        <label for="longitud">Longitud</label>
        <input
          type="number"
          id="longitud"
          name="longitud"
          [(ngModel)]="modelo.Longitud"
          max="10000"
          step="0.01"
          placeholder="0.00"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="profundidad">Profundidad</label>
        <input
          type="number"
          id="profundidad"
          name="profundidad"
          [(ngModel)]="modelo.Profundidad"
          max="10000"
          step="0.01"
          placeholder="0.00"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label for="altura">Altura</label>
        <input
          type="number"
          id="altura"
          name="altura"
          [(ngModel)]="modelo.Altura"
          max="10000"
          step="0.01"
          placeholder="0.00"
          class="form-input"
        />
      </div>
      @if (error()) {
        <app-mostrarerror
          [inline]="true"
          [error]="error"
          [mensaje]="mensajeerror"
        ></app-mostrarerror>
      }
      <div class="form-submit">
        <button
          type="submit"
          class="register-button"
          [disabled]="!form.valid || procesando"
        >
          <span>{{ textos.boton }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
@if (aviso()) {
  <app-aviso
    [cerrar]="aviso"
    [mensaje]="mensajeaviso"
    (aceptar)="confirmar()"
  ></app-aviso>
}
