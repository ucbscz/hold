<div class="login-container">
  <div class="login-card">
    <h1 class="title">Iniciar sesión</h1>
    <form #form="ngForm" (ngSubmit)="form.valid && login()" class="login-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          (ngModelChange)="incorrecto = false"
          required
          email
          pattern="^[a-zA-Z0-9._%\+\-]+@ucb\.edu\.bo$"
          placeholder="tu@ucb.edu.bo"
          class="form-input"
          #emailInput="ngModel"
        />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input
            [type]="mostrarContrasena ? 'text' : 'password'"
            id="password"
            name="contraseña"
            [(ngModel)]="contrasena"
            (ngModelChange)="incorrecto = false"
            required
            placeholder="••••••••"
            class="form-input password-field__input"
            #passwordInput="ngModel"
          />
          <button
            type="button"
            class="password-field__toggle"
            [attr.aria-label]="
              mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'
            "
            (click)="alternarVisibilidadContrasena()"
          >
            <i
              class="fas"
              [class.fa-eye]="!mostrarContrasena"
              [class.fa-eye-slash]="mostrarContrasena"
            ></i>
          </button>
        </div>
      </div>
      @if (incorrecto) {
        <p class="field-error" role="alert">Correo o contraseña incorrectos</p>
      }
      @if (errorraro()) {
        <app-mostrarerror
          [inline]="true"
          [error]="errorraro"
          mensaje="No se pudo iniciar sesión. Intenta nuevamente."
        ></app-mostrarerror>
      }
      <button
        type="submit"
        class="login-button"
        [disabled]="form.invalid || loading"
      >
        @if (!loading) {
          <span>Ingresar</span>
        } @else {
          <div class="spinner"></div>
        }
      </button>
      <div class="additional-options">
        <p class="register-link">
          ¿No tienes cuenta? <a (click)="registrarUsuario()">Regístrate aquí</a>
        </p>
      </div>
    </form>
  </div>
</div>
