<main class="contract-page" aria-labelledby="contract-page-title">
  <header class="contract-page__heading">
    <span>Contrato de préstamo</span>
    <h1 id="contract-page-title">Revisa y firma el contrato</h1>
    <p>Verifica la información antes de confirmar la solicitud.</p>
  </header>
  <section class="contrato-container" aria-label="Vista previa del contrato">
    <div
      #contratoContainer
      class="formulario"
      [innerHTML]="contenidoHtml"
    ></div>
    <div class="botones-container">
      <button class="boton boton-firmar" (click)="firmar()">
        <i class="fas fa-signature" aria-hidden="true"></i>
        Firmar
      </button>
      <button (click)="aceptar()" class="boton boton-aceptar">
        <i class="fas fa-check" aria-hidden="true"></i>
        Confirmar solicitud
      </button>
    </div>
  </section>
</main>
@if (clickfirma()) {
  <app-firma
    (firma)="guardarfirma($event)"
    [clickfirma]="clickfirma"
  ></app-firma>
}
@if (error()) {
  <app-mostrarerror [error]="error" [mensaje]="mensajeerror"></app-mostrarerror>
}
@if (cargando) {
  <app-pantalla-carga></app-pantalla-carga>
}
@if (aviso()) {
  <app-aviso
    [cerrar]="aviso"
    [mensaje]="mensajeaviso"
    (aceptar)="confirmarprestamo()"
  ></app-aviso>
}
@if (avisoexito()) {
  <app-aviso-exito
    [exito]="avisoexito"
    [mensaje]="mensajeexito"
    (accion)="redirigirAnterior()"
  ></app-aviso-exito>
}
