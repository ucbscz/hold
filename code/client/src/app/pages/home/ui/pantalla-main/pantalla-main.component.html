<div #searchContainer class="container-search" [class.open]="showCategories">
  <div class="search-input">
    <img class="icon search-icon" src="assets/search_line.png" alt="" />
    <textarea
      [(ngModel)]="solicitud"
      placeholder="Buscar..."
      rows="1"
      (keydown.enter)="$event.preventDefault()"
      (focus)="ocultarCategorias()"
    ></textarea>

    @if (solicitud) {
      <button
        class="clear-search"
        (click)="limpiarBusqueda()"
        title="Limpiar búsqueda"
        type="button"
      >
        <i class="fas fa-times"></i>
      </button>
    }
    @if (resumenCategorias) {
      <button
        type="button"
        class="category-summary"
        [title]="resumenCategorias"
        (click)="alternarCategorias()"
      >
        <span class="category-summary__dot" aria-hidden="true"></span>
        <span>{{ resumenCategorias }}</span>
      </button>
      <button
        type="button"
        class="clear-categories"
        title="Quitar todas las categorías"
        aria-label="Quitar todas las categorías"
        (click)="limpiarCategorias(); $event.stopPropagation()"
      >
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    }
    <button
      type="button"
      class="category-toggle"
      [class.category-toggle--active]="categoriasSeleccionadas.size > 0"
      [attr.aria-expanded]="showCategories"
      aria-label="Filtrar por categorías"
      (click)="alternarCategorias()"
    >
      <img class="icon category-icon" src="assets/categories_line.png" alt="" />
    </button>
  </div>
  @if (showCategories) {
    <div class="categories-panel">
      <div class="categories-list">
        <div
          class="category-item"
          [class.selected]="estaCategoriaSeleccionada('sinCategoria')"
          (click)="seleccionarCategoria('sinCategoria')"
        >
          Sin categoría
        </div>
        @for (item of items; track item.Nombre) {
          <div
            class="category-item"
            [class.selected]="estaCategoriaSeleccionada(item.Nombre!)"
            (click)="seleccionarCategoria(item.Nombre!)"
          >
            {{ item.Nombre }}
          </div>
        }
      </div>
    </div>
  }
</div>
<app-lista-objetos
  [categorias]="categoriasArray"
  [producto]="solicitud"
></app-lista-objetos>
@if (error()) {
  <app-mostrarerror [error]="error" [mensaje]="mensajeerror"></app-mostrarerror>
}
