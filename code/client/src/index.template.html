<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>{{ productName }} | {{ tagline }}</title>
    <base href="/" />

    <meta name="description" content="{{ description }}" />
    <meta name="author" content="{{ author }}" />
    <link rel="canonical" href="{{ siteUrl }}/" />

    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="{{ productName }}" />
    <meta
      name="title"
      property="og:title"
      content="{{ productName }} | {{ tagline }}"
    />
    <meta
      name="description"
      property="og:description"
      content="{{ socialDescription }}"
    />
    <meta property="og:url" content="{{ siteUrl }}/" />
    <meta
      name="image"
      property="og:image"
      content="{{ siteUrl }}/{{ assets.socialCover }}?v={{ assets.socialCoverVersion }}"
    />
    <meta
      property="og:image:secure_url"
      content="{{ siteUrl }}/{{ assets.socialCover }}?v={{ assets.socialCoverVersion }}"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ productName }} - {{ tagline }}" />
    <meta property="article:author" content="{{ author }}" />
    <meta property="article:published_time" content="{{ publishedTime }}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ productName }} | {{ tagline }}" />
    <meta name="twitter:description" content="{{ socialDescription }}" />
    <meta
      name="twitter:image"
      content="{{ siteUrl }}/{{ assets.socialCover }}?v={{ assets.socialCoverVersion }}"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"
    />
    <meta name="theme-color" content="{{ themeColor }}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/x-icon" href="{{ assets.favicon }}" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="{{ assets.icon }}"
    />
    <link rel="apple-touch-icon" href="{{ assets.appleTouchIcon }}" />
    <link rel="preconnect" href="{{ fonts.styleOrigin }}" />
    <link rel="preconnect" href="{{ fonts.fileOrigin }}" crossorigin />
    <link href="{{ fonts.stylesheet }}" rel="stylesheet" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "{{ productName }}",
        "url": "{{ siteUrl }}/"
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
