<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>{{ productName }} | {{ tagline }}</title>
    <base href="/" />
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ siteUrl }}/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ productName }}" />
    <meta property="og:title" content="{{ productName }} | {{ tagline }}" />
    <meta property="og:description" content="{{ socialDescription }}" />
    <meta property="og:url" content="{{ siteUrl }}/" />
    <meta
      property="og:image"
      content="{{ siteUrl }}/{{ assets.socialCover }}"
    />
    <meta
      property="og:image:secure_url"
      content="{{ siteUrl }}/{{ assets.socialCover }}"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ productName }} | {{ tagline }}" />
    <meta name="twitter:description" content="{{ socialDescription }}" />
    <meta
      name="twitter:image"
      content="{{ siteUrl }}/{{ assets.socialCover }}"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"
    />
    <meta name="theme-color" content="{{ themeColor }}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/x-icon" href="{{ assets.favicon }}" />
    <link rel="apple-touch-icon" href="{{ assets.logo }}" />
    <link rel="preconnect" href="{{ fonts.styleOrigin }}" />
    <link rel="preconnect" href="{{ fonts.fileOrigin }}" crossorigin />
    <link href="{{ fonts.stylesheet }}" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
