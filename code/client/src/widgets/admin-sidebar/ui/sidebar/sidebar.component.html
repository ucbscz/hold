@if (sidebarService.isOpen()) {
  <button
    type="button"
    class="sidebar-backdrop"
    aria-label="Cerrar navegación administrativa"
    (click)="sidebarService.close()"
  ></button>
}
<aside
  class="sidebar-menu"
  [class.sidebar-menu--open]="sidebarService.isOpen()"
  aria-label="Navegación administrativa"
>
  <header class="sidebar-header">
    <strong>Administración</strong>
    <button
      type="button"
      class="sidebar-close"
      aria-label="Cerrar navegación administrativa"
      (click)="sidebarService.close()"
    >
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </header>
  <nav class="contenido" aria-label="Secciones de administración">
    @for (group of groups; track group.label) {
      <section class="sidebar-group" [attr.aria-labelledby]="'nav-' + $index">
        <h2 [id]="'nav-' + $index">{{ group.label }}</h2>
        @for (nav of group.items; track nav) {
          <button
            type="button"
            class="item"
            [class.active]="nav === activeItem"
            [attr.aria-current]="nav === activeItem ? 'page' : null"
            (click)="clickitem(nav)"
          >
            <i [class]="getIcon(nav)" aria-hidden="true"></i>
            <span class="item-text">{{ nav }}</span>
          </button>
        }
      </section>
    }
  </nav>
</aside>
