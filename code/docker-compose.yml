x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  ucb_db:
    container_name: ucb_db
    image: postgres:16-alpine
    restart: on-failure
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ucb_db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - data

  ucb_redis:
    container_name: ucb_redis
    image: redis:7-alpine
    restart: on-failure
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ucb_redis_data:/data
    networks:
      - data

  ucb_elastic:
    container_name: ucb_elastic
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    restart: on-failure
    logging: *default-logging
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ucb_elastic_data:/usr/share/elasticsearch/data
    networks:
      - data

  ucb_server:
    container_name: ucb_server
    build: ./server
    restart: on-failure
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5000:8080"
    env_file:
      - server.env
    environment:
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      APP_DB_PASSWORD: ""
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      HttpsRedirection__Enabled: "false"
      DataProtection__KeysPath: /app/data-protection-keys
      DataProtection__CertificatePath: /run/secrets/data_protection_certificate
      DataProtection__CertificatePasswordFile: /run/secrets/data_protection_certificate_password
      Elasticsearch__Uri: http://ucb_elastic:9200
      Redis__ConnectionString: ucb_redis:6379
    volumes:
      - ucb_dataprotection_keys:/app/data-protection-keys
    secrets:
      - data_protection_certificate
      - data_protection_certificate_password
    depends_on:
      ucb_db:
        condition: service_healthy
      ucb_redis:
        condition: service_healthy
      ucb_elastic:
        condition: service_healthy
    networks:
      - web
      - data

  ucb_client:
    container_name: ucb_client
    build: ./client
    restart: on-failure
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4200:8080"
    depends_on:
      ucb_server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - web

volumes:
  ucb_db_data:
  ucb_redis_data:
  ucb_elastic_data:
  ucb_dataprotection_keys:

networks:
  web:
  data:
    internal: true

secrets:
  data_protection_certificate:
    file: ./secrets/data-protection.pfx
  data_protection_certificate_password:
    file: ./secrets/data-protection-password.txt
