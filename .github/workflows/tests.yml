name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DOTNET_VERSION: 8.0.x
      NODE_VERSION: 22.x
      BUILD_CONFIGURATION: Release
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: code/client/package-lock.json

      - name: Restore frontend
        working-directory: code/client
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: code/client
        run: npm audit --omit=dev --audit-level=moderate

      - name: Restore backend
        run: dotnet restore code/UCB_Hold.sln

      - name: Audit backend dependencies
        shell: bash
        run: |
          dotnet list code/UCB_Hold.sln package --vulnerable --include-transitive --no-restore | tee vulnerable-packages.txt
          if grep -Eq '\s(Low|Moderate|High|Critical)\s+https?://' vulnerable-packages.txt; then
            echo "Backend dependencies have known vulnerabilities"
            exit 1
          fi

      - name: Scan source for secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --no-git --redact --verbose

      - name: Validate data-free database schema
        shell: bash
        run: |
          test -s code/database/schema.sql
          if grep -Eq '^-- Data for Name:|^COPY public\.|^SELECT pg_catalog\.setval' code/database/schema.sql; then
            echo "code/database/schema.sql contains database data"
            exit 1
          fi

      - name: Validate row level security policies
        shell: bash
        run: |
          docker run -d --name rls-db -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=UCB_Hold -v "$PWD/code/database:/sql:ro" postgres:16-alpine
          until docker logs rls-db 2>&1 | grep -q "PostgreSQL init process complete"; do sleep 1; done
          until docker exec rls-db pg_isready -U postgres -d UCB_Hold; do sleep 1; done
          docker exec rls-db psql -q -U postgres -d UCB_Hold -v ON_ERROR_STOP=1 -f /sql/schema.sql
          docker exec rls-db psql -q -U postgres -d UCB_Hold -c "ALTER ROLE reservas_app WITH LOGIN;"
          visible=$(docker exec rls-db psql -tA -U reservas_app -d UCB_Hold -c "SELECT count(*) FROM usuarios;")
          test "$visible" = "0"
          docker rm -f rls-db

      - name: Install coverage report tool
        shell: bash
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.11 --tool-path "$GITHUB_WORKSPACE/.tools"
          test -x "$GITHUB_WORKSPACE/.tools/reportgenerator"

      - name: Install SonarQube scanner
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0

      - name: Start SonarQube analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        run: |
          ORGANIZATION_ARG=""
          if [ -n "$SONAR_ORGANIZATION" ]; then ORGANIZATION_ARG="/o:$SONAR_ORGANIZATION"; fi
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            $ORGANIZATION_ARG \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="code/tests/TestResults/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="code/client/coverage/lcov.info" \
            /d:sonar.coverage.exclusions="code/tests/**"

      - name: Build backend
        run: dotnet build code/UCB_Hold.sln --no-restore --configuration $BUILD_CONFIGURATION

      - name: Test backend with coverage
        run: |
          dotnet test code/tests/UCB_Hold.Tests.csproj \
            --no-build \
            --configuration $BUILD_CONFIGURATION \
            --settings code/tests/coverage.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory code/tests/TestResults \
            --logger "console;verbosity=normal"

      - name: Generate backend HTML coverage
        if: always()
        shell: bash
        run: |
          if ! find code/tests/TestResults -name 'coverage.cobertura.xml' -print -quit | grep -q .; then
            echo "No backend coverage report was produced."
            exit 0
          fi
          "$GITHUB_WORKSPACE/.tools/reportgenerator" \
            -reports:"code/tests/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"code/tests/coveragereport" \
            -reporttypes:"Html;TextSummary"

      - name: Check frontend format
        working-directory: code/client
        run: npm run format:check

      - name: Typecheck frontend app
        working-directory: code/client
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck frontend tests
        working-directory: code/client
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Test frontend with coverage
        working-directory: code/client
        run: npm run test:coverage

      - name: Build frontend
        working-directory: code/client
        run: npm run build

      - name: Finish SonarQube analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-coverage-html
          path: code/tests/coveragereport/

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-coverage
          path: code/client/coverage/
